include:
  - project.yml
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CroniclePhone:
    type: application
    platform: iOS
    sources: [Phone, Sources/WatchLedger.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mconstant.cronicle.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cronicle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a spoken task when you tap Speak.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into an editable task on this device.
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
  CroniclePhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhoneUITests]
    dependencies:
      - target: CroniclePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mconstant.cronicle.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CroniclePhone
        SWIFT_VERSION: "5.0"
schemes:
  CroniclePhone:
    build:
      targets:
        CroniclePhone: all
    test:
      targets: [CroniclePhoneUITests]
