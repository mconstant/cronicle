name: CronicleWatch
options:
  deploymentTarget:
    watchOS: "10.0"
targets:
  CronicleWatch:
    type: application
    platform: watchOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mconstant.cronicle.watch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Cronicle
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
        TARGETED_DEVICE_FAMILY: 4
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: 1
  CronicleWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies:
      - target: CronicleWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mconstant.cronicle.watch.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CronicleWatch
        TARGETED_DEVICE_FAMILY: 4
        SWIFT_VERSION: "5.0"
schemes:
  CronicleWatch:
    build:
      targets:
        CronicleWatch: all
    test:
      targets: [CronicleWatchUITests]
