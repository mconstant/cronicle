name: iPhone QA

on:
  push:
    branches: [feat/native-iphone-beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          brew install xcodegen
      - name: Exercise the offline iPhone workflow
        run: bash watch/phone-qa.sh
