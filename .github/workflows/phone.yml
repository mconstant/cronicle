name: iPhone QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: iphone-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          brew install xcodegen
      - name: Exercise the offline iPhone workflow
        run: bash watch/phone-qa.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          for result in watch/build/phone-test.*/phone-results.xcresult; do
            [[ -d "$result" ]] || continue
            xcrun xcresulttool export attachments --path "$result" \
              --output-path watch/build/phone-screenshots
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cronicle-iphone-qa
          path: |
            watch/build/phone-test.*/phone-results.xcresult
            watch/build/phone-screenshots
