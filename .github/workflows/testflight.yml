name: TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v1.4.0
        required: true
        type: string
      product:
        description: App to upload
        type: choice
        default: watch
        options: [watch, iphone]
  workflow_run:
    workflows: [Publish container]
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      vars.CRONICLE_TESTFLIGHT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the public release and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          PRODUCT: ${{ inputs.product || 'watch' }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" HEAD
          [[ -z "$RUN_SHA" || "$sha" == "$RUN_SHA" ]]
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Expected a stable published release") else . end'
          git cat-file -e "$sha:watch/testflight.sh"
          if [[ "$PRODUCT" == iphone ]]; then git cat-file -e "$sha:watch/phone.yml"; fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"

  upload:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 25
    environment: testflight
    concurrency:
      group: cronicle-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-workflow
          persist-credentials: false
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          brew install xcodegen
      - name: Archive and upload to internal TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_PROVISIONING_PROFILE_BASE64 }}
          APPLE_IPHONE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IPHONE_PROVISIONING_PROFILE_BASE64 }}
          PRODUCT: ${{ inputs.product || 'watch' }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash release-workflow/watch/testflight.sh release-source/watch "$RELEASE_TAG" "$PRODUCT"
