name: Publish container

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release-image: ${{ steps.version.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" unused "image@sha256:$(printf '%064d' 0)" >/dev/null

      - name: Build container
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cli"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" .
      - name: Check bootstrap prompts
        run: bash tests/bootstrap.sh

      - name: Run container tests
        run: bash tests/container.sh "ghcr.io/${GITHUB_REPOSITORY,,}-cli:latest"

      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cli"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Publish versioned container
        id: version
        if: github.ref_type == 'tag'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cli"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$image:$GITHUB_SHA" "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
          pinned=$(docker image inspect "$image:$GITHUB_REF_NAME" --format '{{index .RepoDigests 0}}')
          printf 'image=%s\n' "$pinned" >> "$GITHUB_OUTPUT"

  watch:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          brew install xcodegen
      - name: Build the watchOS simulator app and run ledger tests
        run: bash watch/qa.sh build
      - name: Run watchOS interaction tests and capture a screenshot
        timeout-minutes: 10
        run: bash watch/qa.sh test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cronicle-watch
          path: |
            watch/build/cronicle-watch-simulator.zip
            watch/build/cronicle-watch.png
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [publish, watch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull and execute the published image
        env:
          RELEASE_IMAGE: ${{ needs.publish.outputs.release-image }}
        run: |
          docker pull "$RELEASE_IMAGE"
          docker run --rm "$RELEASE_IMAGE" --version | grep -Fx "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cronicle-watch
          path: watch-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.release-image }}
        run: |
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" "$source_url" "$RELEASE_IMAGE" > "$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          range="$GITHUB_SHA"
          if [[ -n "$previous" ]] && git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
            range="$previous..$GITHUB_SHA"
          fi
          {
            printf '\n## Changelog\n\n'
            git log --format='### %s%n%nCommit: `%H` · Author: %an%n%n%b' "$range"
          } >> "$RUNNER_TEMP/release-notes.md"
          printf '\n## Apple Watch MVP\n\nFocus Brief shows current and upcoming work offline and can read it aloud. The attached ZIP runs in a watchOS simulator. See [Watch setup](%s/watch/README.md).\n' "$source_url" >> "$RUNNER_TEMP/release-notes.md"
          printf '\n## iPhone beta source\n\nCronicle for iPhone offers standalone, offline task capture, timers, and a voice draft you can edit before saving. The iPhone simulator acceptance tests cover review, cancellation, typed fallback, and relaunch persistence. See [TestFlight setup](%s/watch/TESTFLIGHT.md) for signed beta availability.\n' "$source_url" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" watch-artifacts/cronicle-watch-simulator.zip watch-artifacts/cronicle-watch.png --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
